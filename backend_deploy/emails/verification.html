<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Verifica tu correo</title>

  </head>
  <body>
    <div class="container">
      <h2>Hola {{username}}</h2>

      <small>RedTip - Pedido y delivery</small>
    </div>

</html>
