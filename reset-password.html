<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar clave - RedTip</title>
  <style>
    body {
      margin: 0;
      font-family: 'Times New Roman', Times, serif;
      background: linear-gradient(135deg, #f2f7fb 0%, #e6eef5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      padding: 24px;
    }
    h1 {
      margin: 0 0 10px;
      color: #1f2d3d;
      font-size: 1.6rem;
    }
    p {
      margin: 0 0 14px;
      color: #4c5a67;
    }
    label {
      display: block;
      margin: 10px 0 6px;
      color: #223;
      font-weight: 700;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d3dbe3;
      border-radius: 8px;
      padding: 10px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      margin-top: 14px;
      border: none;
      border-radius: 8px;
      background: #16a085;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 11px;
      cursor: pointer;
    }
    button:hover {
      background: #138d75;
    }
    .msg {
      margin-top: 10px;
      display: none;
      font-weight: 700;
    }
    .error {
      color: #b00020;
    }
    .ok {
      color: #1e7e34;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Recuperar clave</h1>
    <p>Ingresa tu nueva contraseña para completar la recuperación.</p>
    <form id="resetForm">
      <label for="newPassword">Nueva contraseña</label>
      <input id="newPassword" type="password" minlength="6" required>

      <label for="confirmPassword">Confirmar contraseña</label>
      <input id="confirmPassword" type="password" minlength="6" required>

      <button type="submit">Guardar nueva clave</button>
      <div id="msg" class="msg"></div>
    </form>
  </main>

  <script>
    (function(){
      const API_BASE = (
        window.REDTIP_API_BASE ||
        localStorage.getItem('rt_api_base') ||
        ((window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
          ? 'http://localhost:3000'
          : '')
      ).replace(/\/$/, '');

      const form = document.getElementById('resetForm');
      const msg = document.getElementById('msg');
      const newPassword = document.getElementById('newPassword');
      const confirmPassword = document.getElementById('confirmPassword');

      function showMessage(text, ok){
        msg.style.display = 'block';
        msg.className = 'msg ' + (ok ? 'ok' : 'error');
        msg.textContent = text;
      }

      form.addEventListener('submit', async function(e){
        e.preventDefault();
        const token = new URLSearchParams(window.location.search).get('token') || '';
        const pass = (newPassword.value || '').trim();
        const pass2 = (confirmPassword.value || '').trim();

        if(!token){
          showMessage('Token inválido o ausente.', false);
          return;
        }
        if(pass.length < 6){
          showMessage('La contraseña debe tener al menos 6 caracteres.', false);
          return;
        }
        if(pass !== pass2){
          showMessage('Las contraseñas no coinciden.', false);
          return;
        }

        try {
          const res = await fetch(API_BASE + '/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: pass })
          });
          const data = await res.json();
          if(!res.ok){
            showMessage(data.error || 'No se pudo restablecer la clave.', false);
            return;
          }
          showMessage('Clave actualizada. Ya puedes iniciar sesión.', true);
          form.reset();
        } catch (err) {
          showMessage('No se pudo contactar el servidor.', false);
        }
      });
    })();
  </script>
</body>
</html>
