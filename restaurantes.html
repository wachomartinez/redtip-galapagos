    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('deliverygalapagos.webp') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .categoria {
            margin-top: 32px;
        }
        .categoria h2 {
            color: #16a085;
            border-bottom: 1px solid #ddd;
            padding-bottom: 6px;
        }
        .restaurante {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            border-bottom: 1px solid #eee;
            padding: 16px 0;
        }
        /* Hacer la tarjeta clicable cuando contiene un enlace */
        .restaurante a.restaurante-link {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            color: inherit;
            text-decoration: none;
            width: 100%;
        }
        .restaurante a.restaurante-link:hover .nombre {
            text-decoration: underline;
        }
        .restaurante:last-child {
            border-bottom: none;
        }
        .restaurante img {
            width: 90px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .nombre {
            font-size: 1.3em;
            color: #2980b9;
            margin-bottom: 6px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .ofrece {
            color: #555;
        }
        .estado-badge-wrapper { display:inline-flex; align-items:center; gap:6px; margin-left:8px; margin-right:6px; }
        .status-dot { width:10px; height:10px; border-radius:50%; display:inline-block; box-shadow: 0 0 0 3px rgba(0,0,0,0.03); }
        .status-dot.open { background:#2ecc71; }
        .status-dot.closed { background:#e74c3c; }
        /* Ajuste pequeño: asegurar que el badge dentro de .sub queda alineado en móviles */
        @media (max-width:480px){ .sub { flex-wrap:wrap } .estado-badge-wrapper { margin-left:6px; margin-top:4px; } }
        /* Añadidos: botón regresar en lado derecho y botón flotante WhatsApp */
        .regresar-btn {
            position: fixed;
            right: 18px;
            top: 40px;
            background: #2980b9;
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 10002;
        }
        .regresar-btn:hover {
            background: #1f6aa0;
        }

        /* Botón flotante WhatsApp */
        .whatsapp-float {
            position: fixed;
            width: 56px;
            height: 56px;
            bottom: 20px;
            right: 18px;
            background-color: #25d366;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.25);
            z-index: 10001;
            text-decoration: none;
        }
        .whatsapp-float:hover {
            background-color: #20ba5a;
        }
        .whatsapp-float svg {
            width: 28px;
            height: 28px;
            display: block;
        }
        /* Soporta imagen en lugar de SVG */
        .whatsapp-float img {
            width: 28px;
            height: 28px;
            display: block;
            border-radius: 50%;
        }

        /* Colores y badge para estados de horario: abierto = verde, cerrado = rojo */
        .sub { display:inline-flex; align-items:center; gap:8px; color:#666; font-size:0.95em; }
        .estado-badge { padding:3px 8px; border-radius:12px; font-size:0.78em; color:#fff; font-weight:700; display:inline-block; min-width:64px; text-align:center; }
        .sub.open .estado-badge { background: #2ecc71; }
        .sub.closed .estado-badge { background: #e74c3c; }
        .sub.open .abre-time { color: #145a32; font-weight: 700; }
        .sub.open { color: #145a32; }
        .sub.closed .cierra-time { color: #7f1d1d; font-weight: 700; }
        .sub.closed { color: #7f1d1d; }

        /* Carrusel para listado de restaurantes (cafeterías / pizzerías) */
        .listing-carousel{margin-top:14px}
        .listing-carousel .carousel{position:relative;overflow:hidden;border-radius:8px;border:1px solid #eee;background:#fff}
        .listing-carousel .carousel-track{display:flex;transition:transform .35s ease;gap:8px}
        .listing-carousel .slide{min-width:33.3333%;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;align-items:center}
        .listing-carousel .slide img{width:100%;height:120px;object-fit:cover;border-radius:6px}
        .listing-carousel .slide .nombre{font-weight:700;color:#1f6aa0;margin-top:8px;text-align:center}
        .listing-carousel .carousel-controls{position:absolute;top:50%;left:0;right:0;display:flex;justify-content:space-between;padding:0 8px;transform:translateY(-50%);z-index:10}
        .listing-carousel button{background:rgba(0,0,0,0.5);color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer}
        .listing-carousel .carousel-dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
        @media (max-width:768px){ .listing-carousel .slide{min-width:50%} }
        @media (max-width:480px){ .listing-carousel .slide{min-width:100%} .listing-carousel .carousel-controls{display:none} }

        /* Mini carrusel (usado bajo entradas específicas) - unificado al mismo porte */
        .listing-carousel.mini-listing .slide img{height:120px}
        .listing-carousel.mini-listing .slide .nombre{font-size:1em}
        .listing-carousel.mini-listing .slide{padding:8px} 

        /* --- Estilos menú hamburguesa y modal de login --- */
        .topbar { position: fixed; top: 12px; left: 12px; right: 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; z-index:10003; pointer-events:none; }
        .topbar .brand { font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.4); pointer-events:auto; }
        .hamburger-btn { width:44px; height:44px; background:rgba(0,0,0,0.55); color:#fff; border-radius:8px; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; pointer-events:auto; }
        .hamburger-btn:focus { outline:2px solid #fff; }
        .hamburger-menu { position: fixed; top:0; left:0; width:280px; height:100%; background:#fff; box-shadow: 2px 0 12px rgba(0,0,0,0.15); transform:translateX(-100%); transition:transform .28s ease; z-index:10004; padding:20px; display:flex; flex-direction:column; gap:10px; overflow:auto; }
        .hamburger-menu.open { transform:translateX(0); }
        .hamburger-menu a{ color:#2c3e50; text-decoration:none; padding:10px 6px; border-radius:6px; display:block; font-weight:600;}
        .hamburger-menu .menu-header{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
        .hamburger-menu .menu-actions{ margin-top:8px; display:flex; flex-direction:column; gap:8px; }
        .hamburger-menu .menu-actions button,
        .hamburger-menu .menu-actions a{ width:100%; box-sizing:border-box; text-align:center; }
        .hamburger-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.35); display:none; z-index:10002; }
        .hamburger-overlay.open{ display:block; }

        .login-modal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10006; background:rgba(0,0,0,0.45); opacity:0; pointer-events:none; transition:opacity .18s ease; }
        .login-modal.open{ opacity:1; pointer-events:auto; }
        .login-modal .modal { background:#fff; padding:18px; border-radius:10px; width:320px; max-width:92%; box-shadow:0 8px 30px rgba(0,0,0,0.2); }
        .login-modal .modal h3{ margin:0 0 12px 0;}
        .login-modal .modal label{ display:block; font-size:0.9em; margin-top:8px;}
        .login-modal .modal input{ width:100%; padding:8px 10px; border-radius:6px; border:1px solid #ddd; margin-top:6px; box-sizing:border-box;}
        .login-modal .modal .actions{ margin-top:12px; display:flex; gap:8px; justify-content:flex-end;}
        .login-modal .modal .btn-primary{ background:#2980b9; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer;}
        .login-modal .modal .btn-secondary{ background:#eee; color:#333; border:none; padding:8px 12px; border-radius:6px; cursor:pointer;}

        @media (max-width:480px){ .topbar { left:8px; right:8px } .hamburger-menu { width:86%; } }

        /* Ajustes específicos para login visible en menú */
        .menu-login input{ box-sizing:border-box; padding:8px; }
        .menu-login .btn-primary{ background:#16a085; color:#fff; }
        .menu-login .btn-secondary{ background:#eee; color:#333; }
        .menu-profile{ display:none; margin:8px 0 6px; text-align:center; }
        .profile-avatar-wrap{ position:relative; width:82px; height:82px; margin:0 auto; }
        .profile-avatar{ width:82px; height:82px; border-radius:50%; object-fit:cover; border:3px solid #dfe6e9; background:#f4f6f8; display:block; }
        .profile-avatar-btn{ position:absolute; right:-2px; bottom:-2px; width:30px; height:30px; border-radius:50%; border:none; background:#16a085; color:#fff; cursor:pointer; font-size:16px; line-height:1; box-shadow:0 2px 8px rgba(0,0,0,0.25); }
        .profile-avatar-btn:hover{ background:#138d75; }
        .profile-name{ margin-top:10px; font-weight:700; color:#2c3e50; font-size:0.98rem; word-break:break-word; }
        .topbar-profile{ display:none; align-items:center; gap:8px; pointer-events:auto; background:rgba(0,0,0,0.45); padding:4px 8px; border-radius:999px; cursor:pointer; }
        .topbar-profile img{ width:30px; height:30px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,0.85); background:#ecf0f1; }
        .topbar-profile .name{ color:#fff; font-weight:700; font-size:0.92rem; max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* Pedidos / Carrito */
        .order-btn{ display:inline-block; font-weight:700; }
        .cart-float{ position:fixed; left:18px; bottom:20px; width:56px; height:56px; background:#e67e22; color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,0.18); z-index:10005; cursor:pointer; }
        .cart-float .count{ position:absolute; right:-6px; top:-6px; background:#c0392b; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.8em; font-weight:700; }
        .cart-modal{ position:fixed; right:18px; bottom:20px; width:360px; max-width:95%; background:#fff; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.2); z-index:10006; display:none; padding:12px; }
        .cart-modal.open{ display:block; }
        .cart-modal .item{ display:flex; gap:8px; align-items:center; border-bottom:1px solid #eee; padding:8px 0; }
        .cart-modal .item .desc{ flex:1; }
        .cart-modal .total{ font-weight:800; text-align:right; margin-top:8px; }
        .orders-modal{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:#fff; padding:14px; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.3); z-index:10007; display:none; width:90%; max-width:600px; }
        .orders-modal.open{ display:block; max-height:80vh; overflow:auto; }
        .menu-toast{ position:fixed; right:16px; top:72px; max-width:360px; padding:10px 12px; border-radius:10px; color:#fff; font-weight:700; box-shadow:0 10px 24px rgba(0,0,0,0.24); z-index:10020; opacity:0; transform:translateY(-8px); pointer-events:none; transition:opacity .25s ease, transform .25s ease; }
        .menu-toast.show{ opacity:1; transform:translateY(0); }
        .menu-toast.ok{ background:#1e7e34; }
        .menu-toast.error{ background:#b00020; }
        @media (max-width:480px){ .menu-toast{ left:10px; right:10px; top:64px; max-width:none; } }

    </style>

        <input id="orderQty" type="number" min="1" value="1" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;margin-top:6px;">
        <label style="display:block;margin-top:8px">Precio unitario (USD)</label>
        <input id="orderPrice" type="number" min="0" step="0.01" value="10.00" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;margin-top:6px;">

      <div class="total" id="cartTotal">Total: $0.00</div>

      <div id="ordersList" style="margin-top:8px"></div>

<script>
(function(){
  const PROD_API_BASE = 'https://redtip-galapagos.onrender.com';
  const API_BASE = (
    window.REDTIP_API_BASE ||
    localStorage.getItem('rt_api_base') ||
    ((window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : PROD_API_BASE)
  ).replace(/\/$/, '');

  function getForgotPasswordApiBases() {
    const configured = String(window.REDTIP_API_BASE || localStorage.getItem('rt_api_base') || '').trim().replace(/\/$/, '');
    const defaults = (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? ['http://localhost:3000', PROD_API_BASE]
      : [PROD_API_BASE, 'http://localhost:3000'];
    return Array.from(new Set([configured, API_BASE].concat(defaults).filter(Boolean)));
  }

  function buildListingCarousel(containerId, slides){
    const container = document.getElementById(containerId);
    if(!container) return;
    const safeSlides = (Array.isArray(slides) ? slides : []).filter(function(s){
      const slideName = String((s && s.nombre) || '').trim();
      const slideNameKey = slideName.toLowerCase();
      const deletedByName = (typeof isRestaurantDeletedByName === 'function')
        ? isRestaurantDeletedByName(slideName)
        : false;
      if(deletedByName) return false;

      const deletedSlugs = (typeof getDeletedRestaurantSlugs === 'function') ? getDeletedRestaurantSlugs() : [];
      const hiddenAdminSlugs = (typeof getAdminFallbackHiddenSlugs === 'function') ? getAdminFallbackHiddenSlugs() : [];
      const hiddenSlugs = Array.from(new Set([].concat(deletedSlugs, hiddenAdminSlugs)));
      const fallbackRestaurants = (typeof getAdminHardcodedFallbackRestaurants === 'function')
        ? getAdminHardcodedFallbackRestaurants()
        : [];
      const fallbackMatch = fallbackRestaurants.find(function(r){
        return String((r && r.nombre) || '').trim().toLowerCase() === slideNameKey;
      });
      if(fallbackMatch){
        const fallbackSlug = String((fallbackMatch && fallbackMatch.slug) || '').trim().toLowerCase();
        if(fallbackSlug && hiddenSlugs.indexOf(fallbackSlug) !== -1) return false;
      }
      return true;
    });
    if(!safeSlides.length){
      container.innerHTML = '';
      container.style.display = 'none';
      return;
    }
    container.style.display = '';
    container.innerHTML = '';
    const carousel = document.createElement('div'); carousel.className = 'carousel'; carousel.setAttribute('tabindex','0');
    const track = document.createElement('div'); track.className = 'carousel-track';
    safeSlides.forEach(s=>{
      const slide = document.createElement('div'); slide.className = 'slide';
      slide.innerHTML = `<img src="${s.imagen}" alt="${s.nombre}"><div class="nombre">${s.nombre}</div>`;
      track.appendChild(slide);
    });
    carousel.appendChild(track);

    const controls = document.createElement('div'); controls.className = 'carousel-controls';
    controls.innerHTML = '<button type="button" data-action="prev" aria-label="Anterior">‹</button><button type="button" data-action="next" aria-label="Siguiente">›</button>';
    carousel.appendChild(controls);

    const dots = document.createElement('div'); dots.className = 'carousel-dots';

    container.appendChild(carousel); container.appendChild(dots);

    let current = 0; let slidesPerView = 3; let maxIndex = Math.max(0, safeSlides.length - slidesPerView);

    function setSlidesPerView(){
      const w = container.clientWidth;
      slidesPerView = (w < 480) ? 1 : (w < 768) ? 2 : 3;
      track.querySelectorAll('.slide').forEach(sl => sl.style.minWidth = (100/slidesPerView) + '%');
      maxIndex = Math.max(0, safeSlides.length - slidesPerView);
      if(current>maxIndex) current = maxIndex;
      update();
    }

    function update(){
      track.style.transform = `translateX(-${(100/slidesPerView)*current}%)`;
      dots.innerHTML = safeSlides.map((_,i)=>`<button data-dot="${i}" class="${i===current?'active':''}" aria-label="Ir al slide ${i+1}"></button>`).join('');
    }

    controls.querySelectorAll('button[data-action]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ if(btn.dataset.action==='prev') current = Math.max(0,current-1); else current = Math.min(maxIndex,current+1); update(); });
    });

    dots.addEventListener('click', e=>{ const dot = e.target.closest('button[data-dot]'); if(dot){ current = parseInt(dot.dataset.dot,10); if(current>maxIndex) current = maxIndex; update(); } });

    let auto = setInterval(()=>{ current = current < maxIndex ? current+1 : 0; update(); }, 3000);
    carousel.addEventListener('mouseenter', ()=> clearInterval(auto));
    carousel.addEventListener('mouseleave', ()=> auto = setInterval(()=>{ current = current < maxIndex ? current+1 : 0; update(); }, 3000));

    window.addEventListener('resize', setSlidesPerView);
    setSlidesPerView();
  }

  // Inicializar carruseles con slides de ejemplo (ajusta imágenes/nombres según necesites)

  buildListingCarousel('comida-rapida-carousel', []);

  buildListingCarousel('internacional-carousel', []);

  buildListingCarousel('uramakisushi-mini-carousel', []);

  buildListingCarousel('postreria444-mini-carousel', []);

  buildListingCarousel('pizzaencantada-mini-carousel', []);

  function esc(s){
    return String(s || '').replace(/[&<>'"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c];
    });
  }

  function normalizeCategory(value){
    return String(value || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim();
  }

  function prettyCategoryTitle(value){
    const raw = String(value || '').trim();
    if(!raw) return 'Otros restaurantes';
    return raw;
  }

  function getCategoryHost(categoria){
    const normalized = normalizeCategory(categoria);
    if(normalized === 'comida rapida') return document.getElementById('created-restaurants-rapida');
    if(normalized === 'comida internacional') return document.getElementById('created-restaurants-internacional');
    if(normalized === 'cafeterias y postres') return document.getElementById('created-restaurants-postres');
    if(normalized === 'pizzerias y pastas') return document.getElementById('created-restaurants-under-pizza');
    return null;
  }

  function shouldHideRestaurant(r){
    const slug = String((r && r.slug) || '').trim().toLowerCase();
    const nombre = String((r && r.nombre) || '').trim().toLowerCase();
    const noisyNames = new Set(['jijujyj', 'si f', 'wachis']);
    const noisySlugs = new Set(['jijujyj', 'si-f', 'wachis']);
    const isDeleted = isRestaurantDeleted(slug);
    const isDeletedByName = isRestaurantDeletedByName(nombre);
    return isDeleted || isDeletedByName ||
      noisyNames.has(nombre) || noisySlugs.has(slug);
  }

  function getDeletedRestaurantNames(){
    try{
      const raw = localStorage.getItem('rt_deleted_restaurant_names');
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list)
        ? list.map(function(s){ return String(s || '').trim().toLowerCase(); }).filter(Boolean)
        : [];
    }catch(_e){
      return [];
    }
  }

  function setDeletedRestaurantNames(names){
    const unique = Array.from(new Set((Array.isArray(names) ? names : [])
      .map(function(s){ return String(s || '').trim().toLowerCase(); })
      .filter(Boolean)));
    localStorage.setItem('rt_deleted_restaurant_names', JSON.stringify(unique));
  }

  function markRestaurantDeletedByName(name){
    const key = String(name || '').trim().toLowerCase();
    if(!key) return;
    const deleted = getDeletedRestaurantNames();
    if(deleted.indexOf(key) !== -1) return;
    deleted.push(key);
    setDeletedRestaurantNames(deleted);
  }

  function isRestaurantDeletedByName(name){
    const key = String(name || '').trim().toLowerCase();
    if(!key) return false;
    return getDeletedRestaurantNames().indexOf(key) !== -1;
  }

  function getDeletedRestaurantSlugs(){
    try{
      const raw = localStorage.getItem('rt_deleted_restaurants');
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list)
        ? list.map(function(s){ return String(s || '').trim().toLowerCase(); }).filter(Boolean)
        : [];
    }catch(_e){
      return [];
    }
  }

  function resetRestaurantLocalStateOnce(){
    try{
      if(localStorage.getItem('rt_restaurants_state_reset_done') === '1') return;
      // Mantener listas de eliminados para que los borrados persistan tras recargar.
      localStorage.setItem('rt_restaurants_state_reset_done', '1');
    }catch(_e){}
  }

  function setDeletedRestaurantSlugs(slugs){
    const unique = Array.from(new Set((Array.isArray(slugs) ? slugs : [])
      .map(function(s){ return String(s || '').trim().toLowerCase(); })
      .filter(Boolean)));
    localStorage.setItem('rt_deleted_restaurants', JSON.stringify(unique));
  }

  function isRestaurantDeleted(slug){
    const key = String(slug || '').trim().toLowerCase();
    if(!key) return false;
    return getDeletedRestaurantSlugs().indexOf(key) !== -1;
  }

  function markRestaurantDeleted(slug){
    const key = String(slug || '').trim().toLowerCase();
    if(!key) return;
    const deleted = getDeletedRestaurantSlugs();
    if(deleted.indexOf(key) !== -1) return;
    deleted.push(key);
    setDeletedRestaurantSlugs(deleted);
  }

  function getRecentCreatedRestaurants(){
    try{
      const raw = localStorage.getItem('rt_recent_restaurants');
      const list = raw ? JSON.parse(raw) : [];
      const safeList = Array.isArray(list) ? list : [];
      const filtered = safeList.filter(function(item){ return !shouldHideRestaurant(item); });
      if(filtered.length !== safeList.length){
        localStorage.setItem('rt_recent_restaurants', JSON.stringify(filtered));
      }
      return filtered;
    }catch(_e){
      return [];
    }
  }

  function toCarouselKey(value){
    return String(value || 'restaurante')
      .toLowerCase()
      .replace(/[^a-z0-9_-]+/g, '-')
      .replace(/^-+|-+$/g, '') || 'restaurante';
  }

  function getCategoryAnchorKey(categoria){
    const normalized = normalizeCategory(categoria) || 'otros-restaurantes';
    return toCarouselKey(normalized);
  }

  function ensureDynamicCategoryHost(categoria){
    const wrapper = document.getElementById('dynamic-created-categories');
    if(!wrapper) return null;

    const key = getCategoryAnchorKey(categoria);
    const hostId = 'created-restaurants-dynamic-' + key;
    const existingHost = document.getElementById(hostId);
    if(existingHost) return existingHost;

    const section = document.createElement('div');
    section.className = 'categoria';
    section.id = 'created-category-' + key;

    const title = document.createElement('h2');
    title.textContent = prettyCategoryTitle(categoria);

    const host = document.createElement('div');
    host.id = hostId;

    section.appendChild(title);
    section.appendChild(host);
    wrapper.appendChild(section);
    return host;
  }

  function getRestaurantSlides(r){
    const image = String((r && r.imagen_url) || 'pizzaencantada.webp');
    const names = [];

    const localItems = Array.isArray(r && r.menu_items) ? r.menu_items : [];
    localItems.forEach(function(item){
      const n = String(item || '').trim();
      if(n) names.push(n);
    });

    if(names.length === 0){
      const rawMenu = r && r.menu_json;
      try{
        const parsed = (typeof rawMenu === 'string') ? JSON.parse(rawMenu) : rawMenu;
        (Array.isArray(parsed) ? parsed : []).forEach(function(cat){
          (Array.isArray(cat && cat.items) ? cat.items : []).forEach(function(item){
            const n = String((item && item.nombre) || '').trim();
            if(n) names.push(n);
          });
        });
      }catch(_e){
        // Si no se puede parsear, usamos fallback abajo.
      }
    }

    const unique = [];
    const seen = new Set();
    names.forEach(function(n){
      const key = n.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      unique.push(n);
    });

    const baseName = String((r && r.nombre) || 'Restaurante').trim();
    const finalNames = unique.length > 0 ? unique.slice(0, 8) : [baseName, 'Especial de la casa', 'Recomendado'];
    const fallbackNames = [baseName, 'Especial de la casa', 'Recomendado'];

    // Garantiza al menos 3 tarjetas en el mini carrusel.
    while(finalNames.length < 3){
      const nextName = fallbackNames[finalNames.length] || ('Plato ' + (finalNames.length + 1));
      if(finalNames.indexOf(nextName) === -1){
        finalNames.push(nextName);
      }else{
        finalNames.push('Plato ' + (finalNames.length + 1));
      }
    }

    return finalNames.map(function(n){ return { nombre: n, imagen: image }; });
  }

  function buildCreatedRestaurantCard(r, miniCarouselId){
    const slug = esc(r.slug || 'restaurante');
    const nombre = esc(r.nombre || 'Restaurante');
    const descripcion = esc(r.descripcion || 'Nuevo restaurante agregado por usuarios.');
    const apertura = esc(r.apertura || '08:00');
    const cierre = esc(r.cierre || '22:00');
    const imagen = esc(r.imagen_url || 'pizzaencantada.webp');
    return `
      <div class="restaurante" style="margin-top:14px;">
        <a class="restaurante-link" href="restaurante_detalle.html?r=${slug}">
          <img src="${imagen}" alt="${nombre}">
          <div>
            <div class="nombre">${nombre}</div>
            <div class="ofrece">${descripcion}</div>
            <div class="sub" style="color:#666;font-size:0.95em">Abre: ${apertura} · Cierra: ${cierre}</div>
            <button class="order-btn" data-id="${slug}" data-name="${nombre}" style="margin-top:8px;padding:8px 10px;background:#e67e22;color:#fff;border:none;border-radius:6px;cursor:pointer">Pedir</button>
          </div>
        </a>
      </div>
      <div id="${miniCarouselId}" class="listing-carousel mini-listing" aria-label="Mini carrusel ${nombre}"></div>
    `;
  }

  async function renderCreatedRestaurantsByCategory(){
    function readAllUserRestaurantsFromLocalStorage(){
      try{
        const out = [];
        const seen = new Set();
        for(let i = 0; i < localStorage.length; i += 1){
          const key = String(localStorage.key(i) || '');
          if(!key || key.indexOf('rt_user_restaurants_') !== 0) continue;
          const raw = localStorage.getItem(key);
          const list = raw ? JSON.parse(raw) : [];
          const safeList = Array.isArray(list) ? list : [];
          safeList.forEach(function(item){
            if(shouldHideRestaurant(item)) return;
            const slug = String((item && item.slug) || '').trim().toLowerCase();
            const name = String((item && item.nombre) || '').trim().toLowerCase();
            const dedupeKey = slug || name;
            if(!dedupeKey || seen.has(dedupeKey)) return;
            seen.add(dedupeKey);
            out.push(item);
          });
        }
        return out;
      }catch(_e){
        return [];
      }
    }

    const allHosts = [
      document.getElementById('created-restaurants-rapida'),
      document.getElementById('created-restaurants-internacional'),
      document.getElementById('created-restaurants-postres'),
      document.getElementById('created-restaurants-under-pizza')
    ].filter(Boolean);
    allHosts.forEach(function(h){ h.innerHTML = ''; });
    const dynamicWrapper = document.getElementById('dynamic-created-categories');
    if(dynamicWrapper) dynamicWrapper.innerHTML = '';

    const recent = getRecentCreatedRestaurants();
  const userRecent = readAllUserRestaurantsFromLocalStorage();
    const apiCreated = [];
    try{
      const res = await fetch(API_BASE + '/api/restaurants');
      if(res.ok){
        const data = await res.json();
        const created = Array.isArray(data.restaurants) ? data.restaurants : [];
        created.forEach(function(r){ apiCreated.push(r); });
      }
    }catch(e){
      // Si la API falla, mostramos los creados en localStorage.
    }

    const merged = [];
    const seenSlugs = new Set();
    const seenNames = new Set();

    apiCreated.forEach(function(r){
      if(shouldHideRestaurant(r)) return;
      const slugKey = String((r && r.slug) || '').trim().toLowerCase();
      const nameKey = String((r && r.nombre) || '').trim().toLowerCase();
      if((slugKey && seenSlugs.has(slugKey)) || (nameKey && seenNames.has(nameKey))) return;
      if(slugKey) seenSlugs.add(slugKey);
      if(nameKey) seenNames.add(nameKey);
      merged.push(r);
    });

    recent.forEach(function(r){
      if(shouldHideRestaurant(r)) return;
      const slugKey = String((r && r.slug) || '').trim().toLowerCase();
      const nameKey = String((r && r.nombre) || '').trim().toLowerCase();
      if((slugKey && seenSlugs.has(slugKey)) || (nameKey && seenNames.has(nameKey))) return;
      if(slugKey) seenSlugs.add(slugKey);
      if(nameKey) seenNames.add(nameKey);
      merged.push(r);
    });

    userRecent.forEach(function(r){
      if(shouldHideRestaurant(r)) return;
      const slugKey = String((r && r.slug) || '').trim().toLowerCase();
      const nameKey = String((r && r.nombre) || '').trim().toLowerCase();
      if((slugKey && seenSlugs.has(slugKey)) || (nameKey && seenNames.has(nameKey))) return;
      if(slugKey) seenSlugs.add(slugKey);
      if(nameKey) seenNames.add(nameKey);
      merged.push(r);
    });

    merged.forEach(function(r){
        let host = getCategoryHost(r && r.categoria);
        if(!host){
          host = ensureDynamicCategoryHost(r && r.categoria);
        }
        if(!host) return;
        const slugOrName = (r && (r.slug || r.nombre)) || ('restaurante-' + Date.now());
        const miniCarouselId = 'created-mini-carousel-' + toCarouselKey(slugOrName);
        host.insertAdjacentHTML('beforeend', buildCreatedRestaurantCard(r, miniCarouselId));
        buildListingCarousel(miniCarouselId, getRestaurantSlides(r));
    });

    applyHorarioColors();

    const hash = String(window.location.hash || '');
    if(hash.startsWith('#created-category-')){
      const section = document.getElementById(hash.slice(1));
      if(section){
        section.scrollIntoView({ behavior:'smooth', block:'start' });
      }
    }

    // Reaplicar ocultamiento por slug/nombre tras cualquier render.
    purgeHiddenRestaurantsFromPageDom();

    try{
      window.dispatchEvent(new CustomEvent('rt:restaurants-rendered', {
        detail: { total: merged.length }
      }));
    }catch(_e){}
  }

  function purgeHiddenRestaurantsFromPageDom(){
    try{
      document.querySelectorAll('.restaurante-link[href*="restaurante_detalle.html?r="]').forEach(function(link){
        const href = String(link.getAttribute('href') || '');
        const match = href.match(/[?&]r=([^&#]+)/i);
        const slug = match ? decodeURIComponent(match[1]).trim() : '';
        const nombreEl = link.querySelector('.nombre');
        const nombre = String((nombreEl && nombreEl.textContent) || '').trim();
        if(!shouldHideRestaurant({ slug: slug, nombre: nombre })) return;

        const card = link.closest('.restaurante');
        if(card) card.remove();
      });
    }catch(_e){}

    try{ if(typeof hideDeletedSlidesFromCarousels === 'function') hideDeletedSlidesFromCarousels(); }catch(_e){}
    try{ if(typeof enforceDeletedRestaurantsHidden === 'function') enforceDeletedRestaurantsHidden(); }catch(_e){}
  }

  // Exponer helpers para scripts posteriores del menú.
  window.shouldHideRestaurant = shouldHideRestaurant;
  window.isRestaurantDeletedByName = isRestaurantDeletedByName;
  window.isRestaurantDeleted = isRestaurantDeleted;
  window.getDeletedRestaurantSlugs = getDeletedRestaurantSlugs;
  window.getRecentCreatedRestaurants = getRecentCreatedRestaurants;
  window.renderCreatedRestaurantsByCategory = renderCreatedRestaurantsByCategory;
  window.purgeHiddenRestaurantsFromPageDom = purgeHiddenRestaurantsFromPageDom;

  // Limpia estado legado solo una vez para evitar ocultamientos antiguos.
  resetRestaurantLocalStateOnce();
  purgeHiddenRestaurantsFromPageDom();
  if(typeof enforceDeletedRestaurantsHidden === 'function') enforceDeletedRestaurantsHidden();
  renderCreatedRestaurantsByCategory();

  // Horario: muestra badge "Abierto"/"Cerrado", formatea HH:MM y colorea tiempos
  function parseHHMM(t){
    const parts = (''+t).trim().split(':').map(p=>parseInt(p,10));
    return {h: isNaN(parts[0])?0:parts[0], m: isNaN(parts[1])?0:parts[1]||0};
  }
  function formatHHMM(t){
    const p = parseHHMM(t);
    return String(p.h).padStart(2,'0') + ':' + String(p.m).padStart(2,'0');
  }
  function isCurrentlyOpen(openStr, closeStr){
    const now = new Date();
    const open = parseHHMM(openStr);
    const close = parseHHMM(closeStr);
    const openDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), open.h, open.m);
    let closeDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), close.h, close.m);
    // Si la hora de cierre es igual o anterior a la de apertura, asumimos que cierra al día siguiente
    if(closeDate <= openDate){
      closeDate.setDate(closeDate.getDate()+1);
    }
    // También hay que comprobar el caso en que estamos después de medianoche y el periodo comenzó el día anterior
    if(now < openDate){
      const prevOpenDate = new Date(openDate); prevOpenDate.setDate(openDate.getDate()-1);
      const prevCloseDate = new Date(closeDate); prevCloseDate.setDate(closeDate.getDate()-1);
      if(now >= prevOpenDate && now <= prevCloseDate) return true;
    }
    return now >= openDate && now <= closeDate;
  }

  function applyHorarioColors(){
    document.querySelectorAll('.sub').forEach(el=>{
      const txt = el.textContent.trim();

      if(!m) return;
      const open = m[1];
      const close = m[2];
      const openF = formatHHMM(open);
      const closeF = formatHHMM(close);
      const openNow = isCurrentlyOpen(open, close);
      // Actualizar la línea de horario (solo horas) e insertar el badge junto a 'Abre'
      const badgeHtml = `<span class="estado-badge-wrapper ${openNow ? 'open' : 'closed'}"><span class="status-dot ${openNow ? 'open' : 'closed'}" aria-hidden="true"></span><span class="estado-badge" role="status" aria-live="polite">${openNow ? 'Abierto' : 'Cerrado'}</span></span>`;

    });
  }

})();
</script>

  function deduplicateRecentRestaurants(){
    try{
      const raw = localStorage.getItem('rt_recent_restaurants');
      const list = raw ? JSON.parse(raw) : [];
      const safeList = Array.isArray(list) ? list : [];
      const seenSlugs = new Set();
      const seenNames = new Set();
      const deduped = safeList.filter(function(item){
        const slug = String((item && item.slug) || '').trim().toLowerCase();
        const nombre = String((item && item.nombre) || '').trim().toLowerCase();
        if(shouldHideRestaurant(item)) return false;
        if(slug && seenSlugs.has(slug)) return false;
        if(nombre && seenNames.has(nombre)) return false;
        if(slug) seenSlugs.add(slug);
        if(nombre) seenNames.add(nombre);
        return true;
      });
      if(deduped.length !== safeList.length){
        localStorage.setItem('rt_recent_restaurants', JSON.stringify(deduped));
      }
      return deduped;
    }catch(_e){ return []; }
  }

          if(nameKey) seenNames.add(nameKey);

          if(nameKey) seenNames.add(nameKey);

  async function deleteRestaurantFromApi(slug){
    const safeSlug = String(slug || '').trim();

    if(!safeSlug || !token) return false;
    try{
      const res = await fetch(API_BASE + '/api/restaurants/' + encodeURIComponent(safeSlug), {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      return res.ok;
    }catch(_e){
      return false;
    }
  }

  function removeRestaurantFromPageDom(target){
    const slug = String((target && target.slug) || '').trim().toLowerCase();
    const name = String((target && target.nombre) || '').trim().toLowerCase();
    if(!slug && !name) return;
    try{
      document.querySelectorAll('.order-btn').forEach(function(btn){
        const id = String(btn.getAttribute('data-id') || '').trim().toLowerCase();
        const label = String(btn.getAttribute('data-name') || '').trim().toLowerCase();
        if((slug && id === slug) || (name && label === name)){
          const card = btn.closest('.restaurante');
          if(card){
            const next = card.nextElementSibling;
            card.remove();
            if(next && next.classList && next.classList.contains('listing-carousel')){
              next.remove();
            }
          }
        }
      });

      // Elimina cualquier tarjeta o slide que coincida por slug/nombre visible.
      document.querySelectorAll('.restaurante, .slide, .listing-carousel').forEach(function(node){
        const nodeText = String((node && node.textContent) || '').trim().toLowerCase();
        const nodeId = String((node && node.id) || '').trim().toLowerCase();
        const link = node.querySelector ? node.querySelector('.restaurante-link') : null;
        let nodeSlug = '';
        let nodeName = '';
        if(link){
          const href = String(link.getAttribute('href') || '');
          const match = href.match(/[?&]r=([^&#]+)/i);
          nodeSlug = match ? decodeURIComponent(match[1]).trim().toLowerCase() : '';
        }
        const nombreEl = node.querySelector ? node.querySelector('.nombre') : null;
        if(nombreEl) nodeName = String(nombreEl.textContent || '').trim().toLowerCase();
        const matchByName = name && (nodeName === name || nodeText.indexOf(name) !== -1);
        const matchBySlug = slug && (nodeSlug === slug || nodeId.indexOf(slug) !== -1);
        if(!matchByName && !matchBySlug) return;
        if(node.classList && node.classList.contains('listing-carousel')){
          node.remove();
          return;
        }
        const next = node.nextElementSibling;
        node.remove();
        if(next && next.classList && next.classList.contains('listing-carousel')){
          next.remove();
        }
      });

      document.querySelectorAll('.restaurante-link[href*="restaurante_detalle.html?r="]').forEach(function(link){
        const href = String(link.getAttribute('href') || '');
        const match = href.match(/[?&]r=([^&#]+)/i);
        const linkSlug = match ? decodeURIComponent(match[1]).trim().toLowerCase() : '';
        const nombreEl = link.querySelector('.nombre');
        const linkName = String((nombreEl && nombreEl.textContent) || '').trim().toLowerCase();
        if(linkSlug !== slug && (!name || linkName !== name)) return;
        const card = link.closest('.restaurante');
        if(card){
          const next = card.nextElementSibling;
          card.remove();
          if(next && next.classList && next.classList.contains('listing-carousel') && next.classList.contains('mini-listing')){
            next.remove();
          }
        }
      });

      document.querySelectorAll('.listing-carousel').forEach(function(car){
        const id = String(car.id || '').trim().toLowerCase();
        if(id.indexOf(slug) !== -1){
          car.remove();
        }
      });

      document.querySelectorAll('.categoria .restaurante').forEach(function(card){
        const nameEl = card.querySelector('.nombre');
        const cardName = String((nameEl && nameEl.textContent) || '').trim().toLowerCase();
        const link = card.querySelector('.restaurante-link');
        let cardSlug = '';
        if(link){
          const href = String(link.getAttribute('href') || '');
          const match = href.match(/[?&]r=([^&#]+)/i);
          cardSlug = match ? decodeURIComponent(match[1]).trim().toLowerCase() : '';
        }
        if(cardSlug !== slug && (!name || cardName !== name)) return;

        const next = card.nextElementSibling;
        card.remove();
        if(next && next.classList && next.classList.contains('listing-carousel') && next.classList.contains('mini-listing')){
          next.remove();
        }
      });

      document.querySelectorAll('.listing-carousel .slide').forEach(function(slide){
        const nameEl = slide.querySelector('.nombre');
        const slideName = String((nameEl && nameEl.textContent) || '').trim().toLowerCase();
        const slideText = String(slide.textContent || '').trim().toLowerCase();
        if((name && (slideName === name || slideText.indexOf(name) !== -1)) || (slug && slideText.indexOf(slug) !== -1)){
          slide.remove();
        }
      });

      document.querySelectorAll('.listing-carousel .carousel-track').forEach(function(track){
        if(track.querySelector('.slide')) return;
        const carousel = track.closest('.listing-carousel');
        if(carousel) carousel.remove();
      });
    }catch(_e){}
  }

  async function deleteRestaurantTarget(target){
    if(!target) return false;

    const nombre = String((target && target.nombre) || 'este restaurante');
    if(!window.confirm('¿Eliminar "' + nombre + '"?')) return false;

    const slug = String((target && target.slug) || '').trim();
    let targetName = String((target && target.nombre) || '').trim();
    if(!targetName && slug){
      const slugKey = slug.toLowerCase();
      const fromLatest = (Array.isArray(latestMisRestaurantes) ? latestMisRestaurantes : []).find(function(r){
        return String((r && r.slug) || '').trim().toLowerCase() === slugKey;
      });
      if(fromLatest && String((fromLatest && fromLatest.nombre) || '').trim()){
        targetName = String(fromLatest.nombre).trim();
      }
      if(!targetName){
        const fromPage = getRestaurantsFromPageDom().find(function(r){
          return String((r && r.slug) || '').trim().toLowerCase() === slugKey;
        });
        if(fromPage && String((fromPage && fromPage.nombre) || '').trim()){
          targetName = String(fromPage.nombre).trim();
        }
      }
      if(!targetName){
        const fromFallback = getAdminHardcodedFallbackRestaurants().find(function(r){
          return String((r && r.slug) || '').trim().toLowerCase() === slugKey;
        });
        if(fromFallback && String((fromFallback && fromFallback.nombre) || '').trim()){
          targetName = String(fromFallback.nombre).trim();
        }
      }
    }

    // Borrado inmediato del nodo pulsado y de cualquier tarjeta que coincida,
    // antes de tocar estado local o re-renderizar.
    try{
      document.querySelectorAll('[data-restaurant-row]').forEach(function(row){
        const rowSlug = String(row.getAttribute('data-slug') || '').trim().toLowerCase();
        const rowName = String(row.getAttribute('data-name') || '').trim().toLowerCase();
        if((slug && rowSlug === slug.toLowerCase()) || (targetName && rowName === targetName.toLowerCase())){
          row.remove();
        }
      });
    }catch(_e){}

    // Marcar y retirar localmente primero para que el usuario vea el cambio inmediato.
    try{
      if(slug){
        markRestaurantDeleted(slug);
        hideAdminFallbackSlug(slug);
      }
      if(targetName){
        markRestaurantDeletedByName(targetName);
        hideAdminFallbackByName(targetName);
      }

      latestMisRestaurantes = latestMisRestaurantes.filter(function(r){
        return String((r && r.slug) || '').trim().toLowerCase() !== slug.toLowerCase();
      });
      removeRestaurantFromRecentList(target);
      removeRestaurantFromUserList(target);
      removeRestaurantFromPageDom(target);
      purgeHiddenRestaurantsFromPageDom();
    }catch(_e){
      // Continuar aunque falle alguna limpieza local.
    }

    // Intentos de sincronizacion no deben impedir el borrado visible.
    try { await deleteRestaurantFromApi(slug); } catch(_e) {}
    try { await renderMisRestaurantesMenu(); } catch(_e) {}
    try { await renderCreatedRestaurantsByCategory(); } catch(_e) {}
    try { enforceDeletedRestaurantsHidden(); } catch(_e) {}
    try { setTimeout(function(){ window.location.reload(); }, 120); } catch(_e) {}

    return true;
  }

  async function deleteRestaurantByIdentity(rawSlug, rawName){
    const slug = String(rawSlug || '').trim();
    const name = String(rawName || '').trim();
    if(!slug && !name) return false;

    const list = (Array.isArray(latestMisRestaurantes) && latestMisRestaurantes.length)
      ? latestMisRestaurantes
      : deduplicateRecentRestaurants();

    const slugKey = slug.toLowerCase();
    const nameKey = name.toLowerCase();
    const target = list.find(function(r){
      return String((r && r.slug) || '').trim().toLowerCase() === slugKey;
    });
    if(target){
      return deleteRestaurantTarget(target);
    }

    const targetByName = list.find(function(r){
      return String((r && r.nombre) || '').trim().toLowerCase() === nameKey;
    });
    if(targetByName){
      return deleteRestaurantTarget(targetByName);
    }

    const fallbackTarget = { slug: slug, nombre: name || slug };
    const row = document.querySelector('[data-restaurant-row][data-slug="' + CSS.escape(slugKey) + '"]') ||
      document.querySelector('[data-restaurant-row][data-name="' + CSS.escape(nameKey) + '"]');
    if(row){
      const rowSlug = String(row.getAttribute('data-slug') || '').trim();
      const rowName = String(row.getAttribute('data-name') || '').trim();
      return deleteRestaurantTarget({ slug: rowSlug || slug, nombre: rowName || name || slug });
    }
    return deleteRestaurantTarget(fallbackTarget);
  }

  function forceSyncMenuFromCreatedSections(){
    const container = document.getElementById('mis-restaurantes-menu');
    if(!container) return;
    const safeEsc = function(s){
      return String(s || '').replace(/[&<>'"]/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c];
      });
    };
    const selectors = [
      '#created-restaurants-rapida .restaurante-link[href*="restaurante_detalle.html?r="]',
      '#created-restaurants-internacional .restaurante-link[href*="restaurante_detalle.html?r="]',
      '#created-restaurants-postres .restaurante-link[href*="restaurante_detalle.html?r="]',
      '#created-restaurants-under-pizza .restaurante-link[href*="restaurante_detalle.html?r="]',
      '#dynamic-created-categories .restaurante-link[href*="restaurante_detalle.html?r="]'
    ];
    const rows = [];
    const seen = new Set();
    document.querySelectorAll(selectors.join(',')).forEach(function(link){
      const href = String(link.getAttribute('href') || '');
      const match = href.match(/[?&]r=([^&#]+)/i);
      const slug = match ? decodeURIComponent(match[1]).trim() : '';
      const nombreEl = link.querySelector('.nombre');
      const nombre = String((nombreEl && nombreEl.textContent) || '').trim();
      const key = (slug || nombre).toLowerCase();
      if(!key || seen.has(key)) return;
      seen.add(key);
      rows.push({ slug: slug || key.replace(/[^a-z0-9]+/g, '-'), nombre: nombre || 'Restaurante' });
    });

    if(!rows.length) return;

    container.style.display = 'block';
    container.innerHTML = '<div style="font-size:0.78em;font-weight:700;letter-spacing:.02em;opacity:.85;margin:2px 0 6px;">Restaurantes creados</div>' +
      rows.map(function(r){

          '<a href="restaurante_detalle.html?r=' + encodeURIComponent(r.slug) + '" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-decoration:none;color:inherit;font-size:0.95em">' + r.nombre + '</a>' +
          '<span style="background:#16a085;color:#fff;font-size:0.72em;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap">Activo</span>' +
        '</div>';
      }).join('');
  }

          const hasContentLate = String(misRestaurantesContainer.textContent || '').toLowerCase().indexOf('restaurantes creados') !== -1;
          if(!hasContentLate || misRestaurantesContainer.style.display === 'none'){
            if(isAdmin) ensureAdminMenuVisible(misRestaurantesContainer);
            else ensureUserMenuVisible(misRestaurantesContainer);
          }
        }, 120);

        if(!isAdmin){
          const selectors = [
            '#created-restaurants-rapida .restaurante-link[href*="restaurante_detalle.html?r="]',
            '#created-restaurants-internacional .restaurante-link[href*="restaurante_detalle.html?r="]',
            '#created-restaurants-postres .restaurante-link[href*="restaurante_detalle.html?r="]',
            '#created-restaurants-under-pizza .restaurante-link[href*="restaurante_detalle.html?r="]',
            '#dynamic-created-categories .restaurante-link[href*="restaurante_detalle.html?r="]'
          ];
          const links = Array.from(document.querySelectorAll(selectors.join(',')));
          if(links.length){
            const seen = new Set();
            const rows = [];
            links.forEach(function(link){
              const href = String(link.getAttribute('href') || '');
              const match = href.match(/[?&]r=([^&#]+)/i);
              const slug = match ? decodeURIComponent(match[1]).trim() : '';
              const nombreEl = link.querySelector('.nombre');
              const nombre = String((nombreEl && nombreEl.textContent) || '').trim();
              const key = (slug || nombre).toLowerCase();
              if(!key || seen.has(key)) return;
              seen.add(key);
              rows.push({ slug: slug || key.replace(/[^a-z0-9]+/g, '-'), nombre: nombre || 'Restaurante' });
            });
            if(rows.length){
              misRestaurantesContainer.style.display = 'block';
              misRestaurantesContainer.innerHTML = '<div style="font-size:0.78em;font-weight:700;letter-spacing:.02em;opacity:.85;margin:2px 0 6px;">Restaurantes creados</div>' +
                rows.map(function(r){
                  return '<div data-restaurant-row="1" data-slug="' + r.slug + '" data-name="' + r.nombre + '" style="display:flex;align-items:center;gap:6px;padding:4px 0">' +
                    '<a href="restaurante_detalle.html?r=' + encodeURIComponent(r.slug) + '" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-decoration:none;color:inherit;font-size:0.95em">' + r.nombre + '</a>' +
                    '<span style="background:#16a085;color:#fff;font-size:0.72em;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap">Activo</span>' +
                  '</div>';
                }).join('');
            }
          }
        }
      }
    } else {
      loginStatus.textContent = '';
      if(menuLoginWrap) menuLoginWrap.style.display='block';
      if(viewOrdersBtn) viewOrdersBtn.style.display='none';
      openLoginBtn && (openLoginBtn.style.display='none');
      logoutBtn && (logoutBtn.style.display='none');
      topbarLogoutBtn && (topbarLogoutBtn.style.display='none');
      if(crearLink) crearLink.style.display='none';
      if(misRestaurantesContainer) misRestaurantesContainer.style.display='none';
    }
    renderProfile();
  }

  // Cierre con Esc
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ if(loginModal.classList.contains('open')) closeLogin(); else if(menu.classList.contains('open')) closeMenu(); } });

  window.addEventListener('rt:restaurants-rendered', function(){
    if(!localStorage.getItem('rt_user')) return;
    try { renderMisRestaurantesMenu(); } catch(_e) {}
  });

  // Inicializar
  updateAuthUI();
})();
</script>

<script>
(function(){
  const API_BASE = (
    window.REDTIP_API_BASE ||
    localStorage.getItem('rt_api_base') ||
    ((window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://redtip-galapagos.onrender.com')
  ).replace(/\/$/, '');
  const orderModal = document.getElementById('orderModal');
  const orderRestaurantName = document.getElementById('orderRestaurantName');
  const orderRestaurant = document.getElementById('orderRestaurant');
  const orderDetail = document.getElementById('orderDetail');
  const orderQty = document.getElementById('orderQty');
  const orderPrice = document.getElementById('orderPrice');
  const addToCartBtn = document.getElementById('addToCartBtn');
  const cancelOrderBtn = document.getElementById('cancelOrderBtn');

  const cartFloat = document.getElementById('cartFloat');
  const cartCount = document.getElementById('cartCount');
  const cartModal = document.getElementById('cartModal');
  const cartItemsEl = document.getElementById('cartItems');
  const cartTotalEl = document.getElementById('cartTotal');
  const closeCartBtn = document.getElementById('closeCartBtn');
  const checkoutBtn = document.getElementById('checkoutBtn');
  const clearCartBtn = document.getElementById('clearCartBtn');

  const viewOrdersBtn = document.getElementById('viewOrdersBtn');

  const ordersModal = document.getElementById('ordersModal');
  const ordersList = document.getElementById('ordersList');
  const closeOrdersBtn = document.getElementById('closeOrdersBtn');

  function openOrderModal(id,name){ orderRestaurant.value = id; orderRestaurantName.textContent = name; orderDetail.value=''; orderQty.value=1; orderPrice.value=10.00; orderModal.style.display='flex'; orderModal.classList.add('open'); }
  function closeOrderModal(){ orderModal.style.display='none'; orderModal.classList.remove('open'); }

  // Cart (simple array stored in localStorage)
  function getCart(){ try{ return JSON.parse(localStorage.getItem('rt_cart')||'[]'); }catch(e){ return []; } }
  function saveCart(c){ localStorage.setItem('rt_cart', JSON.stringify(c)); renderCart(); }
  function addToCart(item){ const c=getCart(); c.push(item); saveCart(c); }
  function clearCart(){ localStorage.removeItem('rt_cart'); renderCart(); }

  function renderCart(){ const c=getCart(); if(c.length===0){ cartCount.style.display='none'; cartCount.textContent='0'; cartItemsEl.innerHTML='<div style="color:#666">Carrito vacío</div>'; cartTotalEl.textContent='Total: $0.00'; } else { cartCount.style.display='flex'; cartCount.textContent = String(c.length); cartItemsEl.innerHTML=''; let total=0; c.forEach((it,idx)=>{ const div = document.createElement('div'); div.className='item'; div.innerHTML = `<div class="desc"><strong>${it.restaurantName}</strong><div style="font-size:0.95em;color:#666">${it.detail} · x${it.qty} · $${Number(it.price).toFixed(2)}</div></div><div style="text-align:right"><button data-idx="${idx}" class="removeItemBtn" style="background:none;border:none;color:#c0392b;cursor:pointer">Eliminar</button></div>`; cartItemsEl.appendChild(div); total += (Number(it.price)||0)*Number(it.qty||1); }); cartTotalEl.textContent = 'Total: $' + total.toFixed(2); }
  }

  document.addEventListener('click', e=>{
    const btn = e.target.closest('.order-btn');
    if(btn){ openOrderModal(btn.dataset.id, btn.dataset.name); }
    if(e.target.id==='cartFloat' || e.target.closest('#cartFloat')){ cartModal.classList.toggle('open'); }
    if(e.target.classList.contains('removeItemBtn')){ const idx = Number(e.target.dataset.idx); const c=getCart(); c.splice(idx,1); saveCart(c); }
  });

  addToCartBtn && addToCartBtn.addEventListener('click', ()=>{ const id = orderRestaurant.value; const name = orderRestaurantName.textContent; const detail = orderDetail.value.trim()||'Pedido'; const qty = Number(orderQty.value)||1; const price = Number(orderPrice.value)||0; addToCart({ restaurantId:id, restaurantName:name, detail, qty, price }); closeOrderModal(); cartModal.classList.add('open'); });
  cancelOrderBtn && cancelOrderBtn.addEventListener('click', ()=>{ closeOrderModal(); });
  closeCartBtn && closeCartBtn.addEventListener('click', ()=>{ cartModal.classList.remove('open'); });
  clearCartBtn && clearCartBtn.addEventListener('click', ()=>{ if(confirm('Vaciar carrito?')) clearCart(); });

  checkoutBtn && checkoutBtn.addEventListener('click', async ()=>{
    const token = localStorage.getItem('rt_token');
    if(!token){ alert('Debes iniciar sesión para realizar el pedido.'); openLogin(); return; }
    const c = getCart(); if(c.length===0){ alert('El carrito está vacío'); return; }
    const total = c.reduce((s,it)=> s + (Number(it.price)||0)*Number(it.qty||1), 0);
    try{
      const res = await fetch(API_BASE + '/api/orders', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token }, body: JSON.stringify({ items:c, total, address: '' }) });
      const data = await res.json();
      if(!res.ok){ alert(data.error||'Error al enviar pedido'); return; }
      alert('Pedido enviado correctamente. ID: ' + data.order.id);
      clearCart(); cartModal.classList.remove('open');
    }catch(err){ alert('Error: no se pudo contactar el servidor'); }
  });

  function openOrdersModal(){ ordersList.innerHTML='Cargando...'; ordersModal.classList.add('open'); const token = localStorage.getItem('rt_token'); if(!token){ ordersList.innerHTML='<div style="color:#b00020">Debes iniciar sesión para ver tus pedidos</div>'; return; } fetch(API_BASE + '/api/orders', { headers:{ 'Authorization':'Bearer '+token } }).then(r=>r.json()).then(data=>{
    if(data.orders){ ordersList.innerHTML=''; data.orders.forEach(o=>{ const d = document.createElement('div'); d.style.borderBottom='1px solid #eee'; d.style.padding='8px 0'; d.innerHTML = `<div><strong>Pedido #${o.id}</strong> · ${o.status} · ${o.created_at}</div><div style="color:#666">Total: $${Number(o.total).toFixed(2)}</div>`; ordersList.appendChild(d); }); } else { ordersList.innerHTML = '<div>No hay pedidos</div>'; } }).catch(()=>{ ordersList.innerHTML = '<div>Error al cargar</div>'; }); }

  viewOrdersBtn && viewOrdersBtn.addEventListener('click', ()=>{ openOrdersModal(); closeMenu(); });
  closeOrdersBtn && closeOrdersBtn.addEventListener('click', ()=>{ ordersModal.classList.remove('open'); });

  // Inicializar render cart
  renderCart();
})();
</script>
</body>
</html>
